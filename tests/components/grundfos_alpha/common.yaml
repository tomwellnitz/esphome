ble_client:
  - mac_address: 01:02:03:04:05:17
    id: grundfos_alpha_blec

genibus_ble:
  id: grundfos_alpha_bus
  ble_client_id: grundfos_alpha_blec

grundfos_alpha:
  id: grundfos_alpha_pump
  genibus_id: grundfos_alpha_bus
  address: 0xE7
  update_interval: 30s

sensor:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    flow:
      name: Pump flow
    head:
      name: Pump head
    medium_temperature:
      name: Pump medium temperature
    voltage:
      name: Pump voltage
    current:
      name: Pump current
    power:
      name: Pump power
    speed:
      name: Pump speed
    energy:
      name: Pump energy
    operating_hours:
      name: Pump operating hours
    starts:
      name: Pump starts
    warning_code:
      name: Pump warning code
    alarm_code:
      name: Pump alarm code

text_sensor:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    operating_mode:
      name: Pump operating mode in effect
    control_source:
      name: Pump control source
    product_name:
      name: Pump product name
    product_number:
      name: Pump product number
    software_version:
      name: Pump software version
    bluetooth_software_version:
      name: Pump Bluetooth software version
    last_event:
      name: Pump last event

select:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    control_mode:
      name: Pump control mode
    operating_mode:
      name: Pump operating mode

number:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    constant_pressure_setpoint:
      name: Pump constant pressure set point
    proportional_pressure_setpoint:
      name: Pump proportional pressure set point
    constant_speed_setpoint:
      name: Pump constant speed set point

button:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    start:
      name: Pump start
    stop:
      name: Pump stop
    reset_alarm:
      name: Pump reset alarm
    start_air_venting:
      name: Pump start air venting
    stop_air_venting:
      name: Pump stop air venting
    clear_alarm_log:
      name: Pump clear alarm log

switch:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    automatic_night_setback:
      name: Pump automatic night setback
