ble_client:
  - mac_address: 01:02:03:04:05:17
    id: grundfos_alpha_blec

genibus_ble:
  id: grundfos_alpha_bus
  ble_client_id: grundfos_alpha_blec

grundfos_alpha:
  id: grundfos_alpha_pump
  genibus_id: grundfos_alpha_bus
  address: 0xE7
  update_interval: 30s

sensor:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    flow:
      name: Pump flow
    head:
      name: Pump head
    medium_temperature:
      name: Pump medium temperature
    voltage:
      name: Pump voltage
    current:
      name: Pump current
    power:
      name: Pump power
    speed:
      name: Pump speed

text_sensor:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    operating_mode:
      name: Pump operating mode in effect
    control_source:
      name: Pump control source

select:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    control_mode:
      name: Pump control mode
    operating_mode:
      name: Pump operating mode

number:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    constant_pressure_setpoint:
      name: Pump constant pressure set point
    proportional_pressure_setpoint:
      name: Pump proportional pressure set point
    constant_speed_setpoint:
      name: Pump constant speed set point
    pump_kick_wait:
      name: Pump kick wait
    pump_kick_duration:
      name: Pump kick duration

button:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    start:
      name: Pump start
    stop:
      name: Pump stop
    reset_alarm:
      name: Pump reset alarm

switch:
  - platform: grundfos_alpha
    grundfos_alpha_id: grundfos_alpha_pump
    pump_kick:
      name: Pump kick
    clock_program:
      name: Pump clock program
