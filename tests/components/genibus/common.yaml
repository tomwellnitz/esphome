ble_client:
  - mac_address: 01:02:03:04:05:18
    id: genibus_blec

genibus_ble:
  id: genibus_bus
  ble_client_id: genibus_blec

sensor:
  # Object 87/1 of an ALPHA3: the energy counter, a double in Ws at offset 0
  - platform: genibus
    genibus_id: genibus_bus
    name: Pump energy
    address: 0xE7
    object: 87
    sub_id: 1
    offset: 0
    type: double
    expected_type: 0x00E8
    expected_version: 1
    multiply: 0.000000277778
    unit_of_measurement: kWh
    update_interval: 5min
  - platform: genibus
    name: Pump power
    address: 0xE7
    object: 87
    sub_id: 1
    offset: 8
    type: float
